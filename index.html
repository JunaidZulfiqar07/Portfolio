<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Junaid Bin Zulfiqar — Computer Engineer &amp; Automation Builder</title>
<meta name="description" content="Junaid Bin Zulfiqar — Computer Engineering student at UET Taxila, n8n automation developer, and IEEE volunteer leader.">

<!-- Google AdSense Verification Code -->
<script async src="https://googlesyndication.com" crossorigin="anonymous"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:ital,wght@0,500;0,600;0,700;0,800;1,700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#101820;
    --panel:#0B1218;
    --white:#F8FAFC;
    --card:#FFFFFF;
    --yellow:#19D3C5;
    --red:#FF6B5F;
    --grey:#8FA3B8;
    --blue-soft:#E6FBF8;
    --line:#263743;
    --max:1180px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--panel);
    color:var(--white);
    font-family:'Archivo', sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  h1,h2,h3{ font-family:'Anton', sans-serif; font-weight:400; letter-spacing:0.01em; text-transform:uppercase; line-height:1; }
  a{color:inherit; text-decoration:none;}
  img{max-width:100%; display:block;}
  .wrap{max-width:var(--max); margin:0 auto; padding:0 32px;}
  @media (max-width:600px){ .wrap{padding:0 18px;} }
  a:focus-visible, button:focus-visible{ outline:3px solid var(--yellow); outline-offset:3px; }

  .mono{ font-family:'JetBrains Mono', monospace; }

  /* ---------- NAV ---------- */
  .navshell{ position:sticky; top:14px; z-index:50; padding:0 14px; }
  nav{
    max-width:var(--max); margin:0 auto;
    background:var(--black); border:2px solid var(--white); border-radius:60px;
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px 10px 10px;
  }
  .brandbox{
    background:var(--yellow); color:var(--black); border:2px solid var(--black);
    padding:6px 14px; border-radius:6px; font-family:'Anton', sans-serif;
    font-size:1.05rem; transform:rotate(-2deg); display:inline-block;
  }
  .brandwrap{display:flex; align-items:center; gap:10px;}
  .brandtag{ font-family:'JetBrains Mono', monospace; font-size:0.78rem; color:#B7C5D6; }
  .navlinks{ display:none; gap:26px; font-size:0.88rem; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; }
  @media(min-width:840px){ .navlinks{display:flex;} }
  .navlinks a{ position:relative; }
  .navlinks a::after{ content:''; position:absolute; left:0; bottom:-6px; height:2px; width:0; background:var(--yellow); transition:width .25s ease; }
  .navlinks a.active{ color:var(--yellow); }
  .navlinks a.active::after{ width:100%; }
  .navright{display:flex; align-items:center; gap:10px;}
  .pill{
    border:2px solid var(--white); border-radius:30px; padding:8px 16px;
    font-size:0.78rem; font-weight:700; text-transform:uppercase; white-space:nowrap;
    display:none;
  }
  @media(min-width:640px){ .pill{display:inline-block;} }
  .cta-yellow{
    background:var(--yellow); color:var(--black); border:2px solid var(--black);
    border-radius:30px; padding:9px 18px; font-weight:800; font-size:0.85rem;
    display:inline-flex; align-items:center; gap:6px; transition:transform .15s ease;
  }
  .cta-yellow:hover{ transform:translateY(-2px) rotate(-1deg); }

  /* ---------- HERO ---------- */
  .hero{ padding:70px 0 60px; position:relative; }
  .hero-grid{ display:grid; grid-template-columns:1.25fr 0.9fr; gap:50px; align-items:center; }
  @media(max-width:860px){ .hero-grid{grid-template-columns:1fr; gap:40px;} }

  .reveal{ opacity:0; transform:translateY(18px); }
  .hero.play .reveal{ opacity:1; transform:translateY(0); transition:opacity .6s ease, transform .6s cubic-bezier(.2,.8,.2,1); }
  .hero.play .h1{transition-delay:.05s;}
  .hero.play .h2{transition-delay:.16s;}
  .hero.play .h3{transition-delay:.28s;}
  .hero.play .h4{transition-delay:.4s;}
  .hero.play .h5{transition-delay:.22s;}

  .tagbox{
    display:inline-flex; align-items:center; gap:8px; background:var(--yellow); color:var(--black);
    border:2px solid var(--black); border-radius:4px; padding:6px 12px; font-weight:800;
    font-size:0.82rem; text-transform:uppercase; transform:rotate(-1.5deg); margin-bottom:20px;
  }
  .hero h1{
    font-size:clamp(2.6rem, 6.5vw, 4.4rem); color:#FFFFFF; text-shadow:0 2px 18px rgba(0,0,0,.28);
    text-shadow: 3px 3px 0 rgba(124,92,255,.55);
    max-width:11ch;
  }
  .hero p.lede{ margin-top:26px; font-size:1.1rem; color:#D7E2EF; max-width:48ch; line-height:1.75; font-weight:500; }
  .hero-actions{ display:flex; gap:14px; margin-top:34px; flex-wrap:wrap; }
  .btn{
    padding:13px 24px; border-radius:6px; font-size:0.9rem; font-weight:800; text-transform:uppercase;
    border:2px solid var(--black); transition:transform .15s ease;
    display:inline-block;
  }
  .btn-yellow{ background:var(--yellow); color:var(--black); }
  .btn-yellow:hover{ transform:translateY(-3px) rotate(-1deg); }
  .btn-outline{ background:transparent; color:var(--white); border-color:var(--white); }
  .btn-outline:hover{ transform:translateY(-3px) rotate(1deg); border-color:var(--yellow); color:var(--yellow); }

  .photo-frame{ position:relative; justify-self:end; width:100%; max-width:320px; }
  .photo-frame .backer{ position:absolute; inset:12px -12px -12px 12px; background:linear-gradient(135deg,var(--red),var(--yellow)); border-radius:8px; z-index:0; }
  .photo-frame .imgwrap{ position:relative; z-index:1; border:3px solid var(--black); outline:2px solid var(--white); border-radius:8px; overflow:hidden; background:var(--black); }
  .photo-frame img{ filter:grayscale(0.1) contrast(1.05); }
  .photo-tag{
    position:relative; z-index:2; margin-top:18px; background:var(--black); border:2px solid var(--white);
    border-radius:4px; padding:8px 12px; display:flex; justify-content:space-between; font-size:0.78rem;
    font-family:'JetBrains Mono', monospace; color:var(--grey);
  }

  /* ---------- SECTIONS ---------- */
  section{ padding:64px 0; }
  .section-tag{
    display:inline-flex; background:var(--yellow); color:var(--black); border:2px solid var(--black);
    border-radius:4px; padding:6px 12px; font-weight:800; font-size:0.8rem; text-transform:uppercase;
    transform:rotate(-1.5deg); margin-bottom:18px;
  }
  .section-title{ font-size:clamp(2rem, 4vw, 2.9rem); color:var(--white); text-shadow:3px 3px 0 rgba(124,92,255,.55); margin-bottom:16px; }
  .section-sub{ color:#C8D5E4; max-width:62ch; line-height:1.7; font-size:1.02rem; font-weight:500; }
  .section-head{ margin-bottom:40px; opacity:0; transform:translateY(14px); transition:opacity .6s ease, transform .6s ease; }
  .section-head.on{ opacity:1; transform:translateY(0); }

  /* generic white panel */
  .panel{
    position:relative; background:var(--card); color:var(--black);
    border:3px solid var(--black); border-radius:8px; padding:36px;
    opacity:0; transform:translateY(20px) scale(.98);
    transition:opacity .55s ease, transform .55s cubic-bezier(.2,.8,.2,1);
  }
  .panel.on{ opacity:1; transform:translateY(0) scale(1); }
  .rolegrid .panel:nth-child(2){animation-delay:.08s;}
  .rolegrid .panel:nth-child(3){animation-delay:.16s;}
  .rolegrid .panel:nth-child(4){animation-delay:.24s;}
  .rolegrid .panel:nth-child(5){animation-delay:.32s;}
  .panel::after{
    content:''; position:absolute; inset:8px -8px -8px 8px; background:linear-gradient(135deg,var(--red),var(--yellow));
    border-radius:8px; z-index:-1;
  }

  /* ---------- ABOUT ---------- */
  .about-grid{ display:grid; grid-template-columns:1fr; gap:24px; }
  .about-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-top:26px; }
  @media(max-width:640px){ .about-stats{grid-template-columns:1fr 1fr;} }
  .stat{ border:2px solid var(--black); border-radius:6px; padding:16px; background:var(--white); }
  .stat .num{ font-family:'Anton', sans-serif; font-size:2rem; color:var(--red); }
  .stat .label{ font-size:0.82rem; color:var(--black); font-weight:700; margin-top:4px;}
</style>
</head>
